<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Smart Assistant</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">

        <!-- Header -->
        <header class="header">
            <div class="logo">
                <h2>AI Smart Assistant</h2>
            </div>
            <p>Made for Nisha</p>
        </header>

        <!-- Chat Area -->
        <main class="chat-container">

            <div id="chat-box">

                <div class="bot-message">
                    Good Mornig Nisha  
                </div>

            </div>

        </main>

        <!-- Input Area -->
        <footer class="input-container">

            <div class="input-area">

                <input
                    type="text"
                    id="user-input"
                    placeholder="Miss nisha ask me anything..."
                    autocomplete="off"
                >

                <button id="send-btn" type="button">
                    ➤
                </button>

            </div>

            <p class="footer-text">
                Miss Nisha the Ai can make mistakes. Check important information.
            </p>

        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
